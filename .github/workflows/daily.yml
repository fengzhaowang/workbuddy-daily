name: Buddy 加油站每日任务

# 每天定时跑一次，一次把「签到」和「派猫猫旅行」都做掉（多账号）。
# cron 用 UTC：下面这行 = 北京时间每天 00:20 执行。
# 想改时间就改 cron，注意换算：北京时间 = UTC + 8。
on:
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch: {}      # 也可以到 Actions 页面手动点一次

permissions:
  contents: read

# 防止上一次还没跑完又起一次，导致重复提交
concurrency:
  group: buddy-daily
  cancel-in-progress: false

jobs:
  daily:
    # 固定镜像版本，不用 ubuntu-latest。
    # GitHub 已公告 ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26——
    # 那时 python3 版本、OpenSSL 策略都可能变，.latest 会静默换底。
    # 钉死 24.04 保证每天跑的是同一套环境；要升级时手动改这一行。
    runs-on: ubuntu-24.04
    # 时间预算随账号数放大（脚本内 WB_BUDGET_SECONDS），这里留足余量。
    # 账号特别多时（比如 10 个以上）相应调大，或把账号拆成多个 workflow。
    timeout-minutes: 20
    steps:
      # v5 起用 Node 24；v4 是 Node 20，runner 上会打弃用告警并强制降级运行
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 签到 + 派猫猫，并推送通知
        env:
          # 多账号清单：JSON 数组，由本机刷新脚本注入（推荐）
          # [{"name":"我的账号","token":"...","uid":"...","domain":"www.workbuddy.cn"}]
          # 某个账号想只收自己的通知（不并进汇总卡片），在它的条目上加 notify，例如
          #   "notify": ["dingtalk"]                                  借全局 secret
          #   "notify": {"wecom": "https://qyapi.weixin.qq.com/..."}  用自己的机器人
          # 所以「谁发给谁」跟着这个 secret 走；改完要重新 --push 一次。
          WB_ACCOUNTS: ${{ secrets.WB_ACCOUNTS }}
          # 旧版单账号 secret，仍兼容；配了 WB_ACCOUNTS 时以清单为准
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          WB_UID: ${{ secrets.WB_UID }}
          WB_DOMAIN: ${{ secrets.WB_DOMAIN }}
          WB_ENV: prod
          # 可选：手动指定整轮时间预算（秒）。不设则按账号数自动算。
          # WB_BUDGET_SECONDS: "600"
          # 可选：有账号 token 过期时不希望整轮算失败，就打开这行，
          # 变成「至少一个账号签到成功即算成功」。
          # WB_ALLOW_PARTIAL: "1"

          # ============ 通知渠道（全局层）============
          # 下面的渠道「配了哪个就发哪个」。全都不配也不会报错，只是不发通知。
          # 它们服务于：① 没配 notify 的账号的汇总卡片；② notify 里只写渠道名、想借全局凭据的人。
          # 各人自带的凭据写在 WB_ACCOUNTS 的 notify 里，不需要在这里建 secret。
          # 配了多个会各发一份；只想发其中几个就点名，例如：
          #   NOTIFY_CHANNELS: dingtalk,serverchan
          #   NOTIFY_CHANNELS: all          # 所有已配置的渠道
          NOTIFY_CHANNELS: ${{ secrets.NOTIFY_CHANNELS }}

          # ① 飞书自定义机器人（Webhook 必填；开了签名校验才需要 _SECRET）
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # ② 企业微信群机器人（群设置 → 群机器人 → 添加，复制 Webhook）
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # ③ 钉钉群机器人。安全设置务必选「加签」——
          #    GitHub runner 出口 IP 是动态的，「IP 白名单」模式必然失败
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # ④ Server酱 / ⑤ PushPlus：都推微信，扫码即可，零门槛（没有飞书就用这俩）
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # ⑥ Bark：iOS 推送（BARK_URL 用于自建服务器）
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          # ⑦ ntfy：开源推送，手机装 App 订阅 topic 即可（NTFY_URL 用于自建服务器）
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          # ⑧ Telegram Bot
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ⑨ 邮件（465 走 SSL，其他端口走 STARTTLS；密码填邮箱「授权码」）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail
          # 解释器路径不写死版本号，动态取当前 runner 上的 python3
          PYTHON_BIN="$(command -v python3)"
          echo "python: ${PYTHON_BIN} ($("${PYTHON_BIN}" -V 2>&1))"
          "${PYTHON_BIN}" scripts/daily.py
