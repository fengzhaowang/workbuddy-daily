name: Buddy 加油站每日任务

# 两类定时，合起来每 6 小时一次（cron 用 UTC：北京时间 = UTC + 8）：
#   ① 整轮：签到 + 派猫猫                      北京 00:20
#   ② 只收猫：领已到家的旅行积分 + 该派就派新一趟  北京 06:20 / 12:20 / 18:20
# 改时间就改 cron。注意 ①②是**同一个文件的两条 cron**：跑哪一段由「触发的 cron」
# 在 scripts/daily.py 的 SCHEDULE_MODES 里查表决定（脚本里只有这一处映射，
# 这里不再复制一份 case；两处各写一份、改一处忘一处就是静默事故）。
# 改了 cron 却没同步那张表：脚本会**大声报警**并按整轮跑（安全的那一边）。
#
# 另：GitHub 的 schedule 是「尽力而为」，高峰期会延迟（官方文档明说整点最挤），
# 实测有晚几分钟到好几小时的。脚本会把「计划 / 实际 / 延迟」打进日志与结果，
# 晚超过 LATE_MINUTES（30 分钟）还会在通知正文里说明，不用对着凌晨 5 点的通知发懵。
on:
  schedule:
    - cron: "20 16 * * *"          # ① 整轮
    - cron: "20 22,4,10 * * *"     # ② 只收猫（UTC 22/04/10 点，即北京 6/12/18 点）
  # 也可以到 Actions 页面手动点一次，并顺手指定只跑哪一段
  workflow_dispatch:
    inputs:
      mode:
        description: "跑哪一段"
        type: choice
        default: all
        options:
          - all    # 签到 + 猫猫（整轮）
          - cat    # 只收猫：领已到家的旅行积分，并该派就派新的一趟

permissions:
  contents: read

# 防止上一次还没跑完又起一次，导致重复提交
concurrency:
  group: buddy-daily
  cancel-in-progress: false

jobs:
  daily:
    # 固定镜像版本，不用 ubuntu-latest。
    # GitHub 已公告 ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26——
    # 那时 python3 版本、OpenSSL 策略都可能变，.latest 会静默换底。
    # 钉死 24.04 保证每天跑的是同一套环境；要升级时手动改这一行。
    runs-on: ubuntu-24.04
    # 时间预算随账号数放大（脚本内 WB_BUDGET_SECONDS = 420 + 150×(N-1)）。
    # 这里必须**明显大于**脚本预算，否则 GitHub 会先一步把任务杀掉：
    # 6 个账号时脚本预算是 1170s，20 分钟（1200s）只剩 30s 余量，太贴了。
    # 账号特别多时（比如 10 个以上）相应调大，或把账号拆成多个 workflow。
    timeout-minutes: 30
    steps:
      # v5 起用 Node 24；v4 是 Node 20，runner 上会打弃用告警并强制降级运行
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 「跑的是旧 commit」已经坑过两次：清单里配了新字段，代码却还是旧的，
      # 新字段被静默忽略，人只能对着「我明明配了怎么没生效」发懵。
      # 把提交号打进日志，一眼就能对照。
      - name: 记录本次运行的提交与时间
        run: |
          echo "本次运行提交：${GITHUB_SHA}"
          git log -1 --format='  %h %ad %s' --date=short
          # 打出真实墙钟时间：cron 是「尽力而为」，日志里有时间才好和计划时间对照
          date -u '+  实际运行（UTC）：%Y-%m-%d %H:%M:%S'
          TZ=Asia/Shanghai date '+  实际运行（北京）：%Y-%m-%d %H:%M:%S'

      - name: 签到 + 派猫猫，并推送通知
        env:
          # 触发的 cron（只有 schedule 事件有值）与手动触发时选的模式，交给脚本判定档位。
          # 放进 env 再由脚本读，不要在 run 里插 ${{ }}——那等于把外部值拼进 shell。
          TRIGGER_CRON: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
          # 多账号清单：JSON 数组，由本机刷新脚本注入（推荐）
          # [{"name":"我的账号","token":"...","uid":"...","domain":"www.workbuddy.cn"}]
          # 某个账号想只收自己的通知（不并进汇总卡片），在它的条目上加 notify，例如
          #   "notify": ["dingtalk"]                                  借全局 secret
          #   "notify": {"wecom": "https://qyapi.weixin.qq.com/..."}  用自己的机器人
          # 所以「谁发给谁」跟着这个 secret 走；改完要重新 --push 一次。
          WB_ACCOUNTS: ${{ secrets.WB_ACCOUNTS }}
          # 旧版单账号 secret，仍兼容；配了 WB_ACCOUNTS 时以清单为准
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          WB_UID: ${{ secrets.WB_UID }}
          WB_DOMAIN: ${{ secrets.WB_DOMAIN }}
          WB_ENV: prod
          # 可选：手动指定整轮时间预算（秒）。不设则按账号数自动算。
          # WB_BUDGET_SECONDS: "600"
          # 可选：有账号 token 过期时不希望整轮算失败，就打开这行，
          # 变成「至少一个账号签到成功即算成功」。
          # WB_ALLOW_PARTIAL: "1"
          # 可选：只收猫那几轮默认「有变化才推送」（免得一天推四遍「猫还在路上」），
          # 想每轮都推就设 always。
          # WB_NOTIFY_MODE: always
          # 可选：推送正文的换行风格。默认 space = 行尾补两个空格换行
          # （markdown 硬换行，也是钉钉官方推荐的写法）；手机上要是还看着挤成一行，
          # 就改成 blank（所有行之间都空一行，最保守，一定能换行，正文会长一点）。
          # 换行规则的来龙去脉见 README「推送长什么样」。
          # WB_PUSH_NEWLINE: blank

          # ============ 通知渠道（全局层）============
          # 下面的渠道「配了哪个就发哪个」。全都不配也不会报错，只是不发通知。
          # 它们服务于：① 没配 notify 的账号的汇总卡片；② notify 里只写渠道名、想借全局凭据的人。
          # 各人自带的凭据写在 WB_ACCOUNTS 的 notify 里，不需要在这里建 secret。
          # 配了多个会各发一份；只想发其中几个就点名，例如：
          #   NOTIFY_CHANNELS: dingtalk,serverchan
          #   NOTIFY_CHANNELS: all          # 所有已配置的渠道
          NOTIFY_CHANNELS: ${{ secrets.NOTIFY_CHANNELS }}

          # ① 飞书自定义机器人（Webhook 必填；开了签名校验才需要 _SECRET）
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # ② 企业微信群机器人（群设置 → 群机器人 → 添加，复制 Webhook）
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # ③ 钉钉群机器人。安全设置务必选「加签」——
          #    GitHub runner 出口 IP 是动态的，「IP 白名单」模式必然失败
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # ④ Server酱 / ⑤ PushPlus：都推微信，扫码即可，零门槛（没有飞书就用这俩）
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # ⑥ Bark：iOS 推送（BARK_URL 用于自建服务器）
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          # ⑦ ntfy：开源推送，手机装 App 订阅 topic 即可（NTFY_URL 用于自建服务器）
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          # ⑧ Telegram Bot
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ⑨ 邮件（465 走 SSL，其他端口走 STARTTLS；密码填邮箱「授权码」）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail
          # 解释器路径不写死版本号，动态取当前 runner 上的 python3
          PYTHON_BIN="$(command -v python3)"
          echo "python: ${PYTHON_BIN} ($("${PYTHON_BIN}" -V 2>&1))"

          # 跑哪一段：交给脚本按「触发的 cron」查表（daily.py 的 SCHEDULE_MODES）决定，
          # 手动触发时以 mode 输入为准，其余情况传 auto。
          # 这里刻意不再写一份 cron -> 模式 的 case：两处各写一份，
          # 改了一处忘了另一处，就是「看起来正常、其实没跑对」的静默错。
          "${PYTHON_BIN}" scripts/daily.py --mode "${DISPATCH_MODE:-auto}"
